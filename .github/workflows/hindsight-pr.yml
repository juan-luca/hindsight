# Every PR ships with its why: comment the hindsight provenance of the diff.
name: hindsight provenance
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hindsight
        run: pip install --quiet .
      - name: Build provenance comment
        run: |
          {
            hindsight prdiff --base "origin/${{ github.base_ref }}"
            echo ""
            echo "_From the repo's own flight recorder — \`hindsight why <file>\` for the full story._"
          } > provenance.md
          cat provenance.md
      - name: Comment on the PR (updates in place)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="<!-- hindsight-provenance -->"
          printf '%s\n\n' "$marker" | cat - provenance.md > body.md
          existing=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -F body=@body.md
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file body.md
          fi
