[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hindsight-recorder"
version = "0.3.0"
description = "The black box your repo ships with: record AI coding sessions into an embedded Relate graph committed next to the code."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["relate-db>=1.0.1"]

[project.scripts]
hindsight = "hindsight.cli:main"

[tool.setuptools]
packages = ["hindsight"]

[tool.setuptools.package-data]
hindsight = ["pricing.json", "skill.md", "hook.sh"]
